# Nginx na frente da aplicação Node (rgmtech.com.br).
#
#   sudo cp deploy/node/nginx-rgmtech.conf /etc/nginx/sites-available/rgmtech
#   sudo ln -s /etc/nginx/sites-available/rgmtech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d rgmtech.com.br -d www.rgmtech.com.br
#
# O certbot reescreve este arquivo adicionando o bloco 443 e o redirect de HTTPS.

upstream rgmtech_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    # Descomente só se o VPS tiver IPv6. Sem suporte, o nginx falha o teste
    # com "socket() [::]:80 failed (97: Address family not supported)".
    # listen [::]:80;
    server_name rgmtech.com.br www.rgmtech.com.br;

    # Anexos do Workflow chegam a 25 MB (limite do multer em api.mjs).
    client_max_body_size 25M;

    access_log /var/log/nginx/rgmtech_access.log;
    error_log  /var/log/nginx/rgmtech_error.log;

    location / {
        proxy_pass http://rgmtech_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sem este header o `trust proxy` do Express não reconhece o HTTPS e o
        # cookie de sessão com Secure é descartado pelo navegador.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # O SSR do TanStack Start responde em stream; bufferizar atrasa o HTML.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
